# nginx перед релеем на втором сервере (Нидерланды). Имя сервера замените на своё.
# Установка:
#   sudo cp relay.conf /etc/nginx/sites-available/relay.conf
#   sudo ln -s /etc/nginx/sites-available/relay.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d relay.ecopolisrf.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# Telegram присылает обновления только на https и только на порты 443, 80, 88, 8443.
# Журнал запросов выключен намеренно: через релей идут сообщения людей боту, и следа
# от них на этом сервере оставаться не должно.

server {
    listen 80;
    server_name relay.ecopolisrf.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relay.ecopolisrf.ru;

    # Сертификаты впишет certbot.

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/relay.error.log warn;

    # Файл в Telegram через бота не больше 50 МБ. Тело идёт потоком, на диск не пишется.
    client_max_body_size 55m;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /health      { proxy_pass http://127.0.0.1:8787; }
    location = /tg/webhook  { proxy_pass http://127.0.0.1:8787; }
    location /api/          { proxy_pass http://127.0.0.1:8787; }
    location /upload/       { proxy_pass http://127.0.0.1:8787; }
    location /ig/           { proxy_pass http://127.0.0.1:8787; }

    location = /robots.txt  { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location /              { return 404; }
}
