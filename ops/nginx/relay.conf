# nginx перед релеем на втором сервере (Нидерланды).
#
# ПОРЯДОК ВАЖЕН: сначала сертификат, потом этот файл. Файл ссылается на сертификат, и
# без него nginx не пройдёт собственную проверку (nginx -t) и не перечитает настройки.
#
#   sudo certbot certonly --nginx -d relay.ecopolisrf.ru
#   sudo cp relay.conf /etc/nginx/sites-available/relay.conf
#   sudo sed -i 's/relay\.ecopolisrf\.ru/ВАШ_АДРЕС/g' /etc/nginx/sites-available/relay.conf   # если адрес другой
#   sudo ln -s /etc/nginx/sites-available/relay.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Telegram присылает обновления только на https и только на порты 443, 80, 88, 8443.
# Журнал запросов выключен намеренно: через релей идут сообщения людей боту, и следа
# от них на этом сервере оставаться не должно. По http не отдаётся ничего: секрет релея
# ходит только по https.

server {
    listen 80;
    server_name relay.ecopolisrf.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name relay.ecopolisrf.ru;

    ssl_certificate     /etc/letsencrypt/live/relay.ecopolisrf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.ecopolisrf.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/relay.error.log warn;

    # Файл в Telegram через бота не больше 50 МБ. Тело идёт потоком, на диск не пишется.
    client_max_body_size 55m;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /health      { proxy_pass http://127.0.0.1:8787; }
    location = /tg/webhook  { proxy_pass http://127.0.0.1:8787; }
    location /api/          { proxy_pass http://127.0.0.1:8787; }
    location /upload/       { proxy_pass http://127.0.0.1:8787; }
    location /ig/           { proxy_pass http://127.0.0.1:8787; }

    location = /robots.txt  { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location /              { return 404; }
}
