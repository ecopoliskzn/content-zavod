# nginx перед сервером завода.
#
# ПОРЯДОК ВАЖЕН: сначала сертификат, потом этот файл. Файл ссылается на сертификат, и
# без него nginx не пройдёт собственную проверку (nginx -t) и не перечитает настройки.
#
#   sudo certbot certonly --nginx -d go.ecopolisrf.ru
#   sudo cp ops/nginx/zavod.conf /etc/nginx/sites-available/zavod.conf
#   sudo sed -i 's/go\.ecopolisrf\.ru/ВАШ_АДРЕС/g' /etc/nginx/sites-available/zavod.conf   # если адрес другой
#   sudo ln -s /etc/nginx/sites-available/zavod.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат certbot получает через сайт nginx по умолчанию, поэтому до этой команды
# ничего настраивать не нужно: достаточно, чтобы адрес уже указывал на сервер.
# Продлевает сертификат сам certbot (системный таймер).
#
# Наружу открыто ровно то, что нужно: ссылки /go, формы /z, документы /doc, приём
# обновлений Telegram от релея, приём событий Instagram, очередь по ключу оператора.
# По http не отдаётся ничего: ключ оператора и секреты релея ходят только по https.

limit_req_zone $binary_remote_addr zone=zavod_forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zavod_go:10m rate=120r/m;

server {
    listen 80;
    server_name go.ecopolisrf.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name go.ecopolisrf.ru;

    ssl_certificate     /etc/letsencrypt/live/go.ecopolisrf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.ecopolisrf.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # IP посетителя в журнал nginx не пишем: счётчик ссылок хранит только обезличенный след.
    access_log off;
    error_log /var/log/nginx/zavod.error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    location = /health        { proxy_pass http://127.0.0.1:3100; }
    location /go/             { limit_req zone=zavod_go burst=40 nodelay; proxy_pass http://127.0.0.1:3100; }
    location /z/              { limit_req zone=zavod_forms burst=5 nodelay; proxy_pass http://127.0.0.1:3100; }
    location /doc/            { proxy_pass http://127.0.0.1:3100; }
    location = /              { proxy_pass http://127.0.0.1:3100; }
    location /youtube-app/    { proxy_pass http://127.0.0.1:3100; }
    location /cb/             { proxy_pass http://127.0.0.1:3100; }
    location = /tg/update     { proxy_pass http://127.0.0.1:3100; }
    location = /ig/webhook    { proxy_pass http://127.0.0.1:3100; }
    location = /admin/queue   { proxy_pass http://127.0.0.1:3100; }

    location = /robots.txt    { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location /                { return 404; }
}
