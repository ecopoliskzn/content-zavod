# Настройки Codex для проекта «Контент-завод Экополис».
#
# Действуют, когда проект отмечен в Codex как доверенный. Если ваша версия Codex не читает
# настройки из каталога проекта, перенесите нужные строки в ~/.codex/config.toml.
# Ключей и адресов здесь нет и быть не должно: они лежат в .env.local и в git не попадают.

# Общие правила проекта (AGENTS.md) Codex читает до этого предела. Что не влезло, он
# отбрасывает молча, поэтому размер файла стережёт тест test/project.test.mjs.
project_doc_max_bytes = 32768

# Сессии пишут файлы только внутри проекта и спрашивают разрешения на остальное.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
# Сеть нужна: команды очереди уходят на сервер завода, загрузка роликов идёт на YouTube
# и в хранилище, сборщики читают ленты.
network_access = true

# Модель здесь не закреплена: берётся та, что выбрана у оператора.
# Правило проекта: тексты (сессии S1, S2, S6) пишет старшая модель с высоким усилием
# рассуждения. Ветки, написанные младшей моделью, у нас читались как конвейер и не
# набирали просмотров. Разбор лент и сводки (S4, S5) можно отдавать младшей.
# Чтобы закрепить усилие для всего проекта, раскомментируйте строку:
# model_reasoning_effort = "high"
